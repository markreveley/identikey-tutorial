<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 734" role="img" aria-labelledby="cer-title">
  <title id="cer-title">The challenge ceremony in four steps between the client, you and the IdentiKey service: Begin posts the challenge, a commitment and the proof kind and receives a request id and a five-minute consent challenge; Prove answers with a passkey assertion (a3) or with your own key's signature over the consent challenge (a4); Sign once verifies the proof, then rechecks expiry and claims the use in a transaction that is committed before it unseals the Ed25519 seed, signs the challenge and the session bind, writes the consent log and zeroizes the seed; Retrieve returns the Response and bind signature to the client that presents the committed secret.</title>
  <defs>
    <marker id="cer-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2)"/>
    </marker>
    <marker id="cer-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="cer-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--bad)"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <line x1="110" y1="64" x2="110" y2="664" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="320" y1="64" x2="320" y2="664" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="530" y1="64" x2="530" y2="664" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- participants -->
  <rect x="30" y="18" width="160" height="44" rx="4" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="110" y="37" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">Client</text>
  <text x="110" y="53" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">app or wallet</text>

  <rect x="240" y="18" width="160" height="44" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="320" y="37" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--accent)" text-anchor="middle">You</text>
  <text x="320" y="53" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">authenticator or held key</text>

  <rect x="450" y="18" width="160" height="44" rx="4" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="530" y="37" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">IdentiKey service</text>
  <text x="530" y="53" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">holds the operational key</text>

  <!-- 1. Begin -->
  <line x1="30" y1="82" x2="610" y2="82" stroke="var(--rule)" stroke-width="1.5"/>
  <rect x="30" y="74" width="80" height="18" rx="3" fill="var(--paper)" stroke="none"/>
  <text x="34" y="88" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)">1  Begin</text>

  <line x1="110" y1="118" x2="524" y2="118" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#cer-arrow-ink)"/>
  <rect x="200" y="100" width="240" height="16" fill="var(--paper)" stroke="none"/>
  <text x="320" y="112" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">POST /managed-challenge/begin</text>
  <rect x="140" y="124" width="360" height="34" fill="var(--paper)" stroke="none"/>
  <text x="320" y="136" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">your XID, the challenge bytes (at most 8 KB), a PKCE-style commitment,</text>
  <text x="320" y="152" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">the proof kind (a3 passkey or a4 held key), the session to bind</text>

  <line x1="530" y1="184" x2="116" y2="184" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#cer-arrow-ink)"/>
  <rect x="200" y="166" width="240" height="14" fill="var(--paper)" stroke="none"/>
  <text x="320" y="178" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">request id + consent challenge</text>
  <rect x="140" y="188" width="360" height="18" fill="var(--paper)" stroke="none"/>
  <text x="320" y="202" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">a digest over everything stored, tagged identikey-managed-consent-v1, valid 5 min</text>

  <!-- 2. Prove -->
  <line x1="30" y1="218" x2="610" y2="218" stroke="var(--rule)" stroke-width="1.5"/>
  <rect x="30" y="210" width="80" height="18" rx="3" fill="var(--paper)" stroke="none"/>
  <text x="34" y="224" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)">2  Prove</text>

  <line x1="110" y1="248" x2="314" y2="248" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#cer-arrow-ink)"/>
  <rect x="130" y="232" width="164" height="14" fill="var(--paper)" stroke="none"/>
  <text x="212" y="243" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">shows you the consent challenge</text>

  <line x1="320" y1="288" x2="524" y2="288" stroke="var(--accent)" stroke-width="2" marker-end="url(#cer-arrow-accent)"/>
  <rect x="330" y="254" width="190" height="28" fill="var(--paper)" stroke="none"/>
  <text x="425" y="265" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--accent)" text-anchor="middle">a3: your passkey assertion</text>
  <text x="425" y="279" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--accent)" text-anchor="middle">a4: your own key's signature</text>
  <text x="425" y="302" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">a4 signs the consent challenge itself</text>
  <text x="425" y="317" font-family="var(--font-mono)" font-size="12" fill="var(--ink-2)" text-anchor="middle">/finish/a3  or  /finish/a4</text>
  <rect x="96" y="320" width="448" height="16" fill="var(--paper)" stroke="none"/>
  <text x="320" y="332" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">an a4 wallet recomputes the digest itself and refuses to sign on a mismatch</text>

  <!-- 3. Sign, once -->
  <line x1="30" y1="350" x2="610" y2="350" stroke="var(--rule)" stroke-width="1.5"/>
  <rect x="30" y="342" width="110" height="18" rx="3" fill="var(--paper)" stroke="none"/>
  <text x="34" y="356" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)">3  Sign, once</text>

  <rect x="400" y="366" width="210" height="196" rx="6" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/>
  <text x="505" y="388" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--accent)" text-anchor="middle">claim first, then sign</text>
  <text x="416" y="410" font-family="var(--font-display)" font-size="12" fill="var(--ink)">verify your proof</text>
  <text x="416" y="428" font-family="var(--font-display)" font-size="12" fill="var(--ink)">recheck the consent expiry</text>
  <text x="416" y="446" font-family="var(--font-display)" font-size="12" fill="var(--ink)">claim the use, committed</text>
  <text x="416" y="464" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink)">unseal the Ed25519 seed</text>
  <text x="416" y="482" font-family="var(--font-display)" font-size="12" fill="var(--ink)">sign the challenge: the Response</text>
  <text x="416" y="500" font-family="var(--font-display)" font-size="12" fill="var(--ink)">sign the session bind</text>
  <text x="416" y="518" font-family="var(--font-display)" font-size="12" fill="var(--ink)">write the consent-log rows</text>
  <text x="416" y="536" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink)">zeroize the seed</text>
  <text x="416" y="554" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">record the outcome</text>

  <!-- the seed's lifetime -->
  <rect x="386" y="454" width="6" height="86" rx="3" fill="var(--warm)" stroke="none"/>
  <rect x="236" y="484" width="144" height="34" fill="var(--paper)" stroke="none"/>
  <text x="378" y="496" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--warm)" text-anchor="end">key in memory</text>
  <text x="378" y="512" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--warm)" text-anchor="end">only here</text>

  <!-- failure -->
  <text x="430" y="580" font-family="var(--font-display)" font-size="12" fill="var(--bad)" text-anchor="middle">on any failure: a signing_failed row, nothing released</text>

  <!-- 4. Retrieve -->
  <line x1="30" y1="600" x2="610" y2="600" stroke="var(--rule)" stroke-width="1.5"/>
  <rect x="30" y="592" width="90" height="18" rx="3" fill="var(--paper)" stroke="none"/>
  <text x="34" y="606" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)">4  Retrieve</text>

  <line x1="110" y1="630" x2="524" y2="630" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#cer-arrow-ink)"/>
  <rect x="180" y="612" width="280" height="16" fill="var(--paper)" stroke="none"/>
  <text x="320" y="624" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">/managed-challenge/retrieve</text>
  <rect x="200" y="634" width="240" height="16" fill="var(--paper)" stroke="none"/>
  <text x="320" y="646" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">with the secret committed at Begin</text>

  <line x1="530" y1="670" x2="116" y2="670" stroke="var(--accent)" stroke-width="2" marker-end="url(#cer-arrow-accent)"/>
  <rect x="200" y="654" width="240" height="14" fill="var(--paper)" stroke="none"/>
  <text x="320" y="665" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--accent)" text-anchor="middle">Response + bind signature, together</text>
  <text x="320" y="688" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">wrong or missing secret: neither.  unfinished attempts read as pending</text>

  <!-- boundary -->
  <text x="320" y="718" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">The account cookie alone cannot start a signature; only a fresh assertion or signature can.</text>
</svg>
