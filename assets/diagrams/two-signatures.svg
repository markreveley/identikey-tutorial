<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 910" role="img" aria-labelledby="ts-title">
  <title id="ts-title">Two signatures, two verifiers. Signature 1: IdentiKey sends Sam's device a random WebAuthn challenge. The browser wraps it with the page's origin in the client data; after a fingerprint or face check, the authenticator signs its authenticator data together with the SHA-256 hash of that client data, using Sam's passkey private key, which never leaves the device. IdentiKey verifies the signature with the public key it stored for that credential, and checks the challenge, the origin, the user-verification flag and the counter. Signature 2: IdentiKey signs the ID token with its own Ed25519 private key, which never leaves the provider, and hands it to the app through the code exchange. The app verifies it with IdentiKey's public key from the JWKS, then checks issuer, audience, expiry and nonce. Neither private key crosses a boundary, and the app never sees Sam's key.</title>
  <defs>
    <marker id="ts-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2)"/>
    </marker>
    <marker id="ts-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="ts-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--warm)"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <line x1="105" y1="64" x2="105" y2="800" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="320" y1="64" x2="320" y2="800" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="535" y1="64" x2="535" y2="800" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- participants -->
  <rect x="20" y="18" width="170" height="44" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="105" y="37" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--accent)" text-anchor="middle">Sam's device</text>
  <text x="105" y="53" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">browser + authenticator</text>

  <rect x="235" y="18" width="170" height="44" rx="4" fill="var(--warm-soft)" stroke="var(--warm)" stroke-width="1.5"/>
  <text x="320" y="37" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--warm)" text-anchor="middle">IdentiKey</text>
  <text x="320" y="53" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">auth.identikey.me</text>

  <rect x="450" y="18" width="170" height="44" rx="4" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="535" y="37" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">App</text>
  <text x="535" y="53" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">the relying party</text>

  <!-- Signature 1 -->
  <line x1="20" y1="84" x2="620" y2="84" stroke="var(--accent)" stroke-width="1.5"/>
  <rect x="20" y="76" width="316" height="18" rx="3" fill="var(--paper)" stroke="none"/>
  <text x="24" y="90" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--accent)">Signature 1: Sam proves himself to IdentiKey</text>

  <line x1="320" y1="124" x2="111" y2="124" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#ts-arrow-ink)"/>
  <text x="212" y="117" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">a random challenge</text>
  <text x="212" y="140" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">for RP ID auth.identikey.me</text>
  <rect x="336" y="110" width="186" height="34" fill="var(--paper)" stroke="none"/>
  <text x="340" y="122" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">IdentiKey keeps its copy</text>
  <text x="340" y="138" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">in the ceremony state, 5 min</text>

  <!-- device signs -->
  <rect x="20" y="160" width="276" height="176" rx="6" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/>
  <text x="34" y="182" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">the browser writes the client data:</text>
  <text x="34" y="200" font-family="var(--font-mono)" font-size="12" fill="var(--ink)">{ type, challenge, origin }</text>
  <text x="34" y="222" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">fingerprint or face unlocks the key once</text>
  <text x="34" y="244" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">the authenticator signs:</text>
  <text x="34" y="262" font-family="var(--font-mono)" font-size="12" fill="var(--ink)">authenticatorData ‖</text>
  <text x="34" y="278" font-family="var(--font-mono)" font-size="12" fill="var(--ink)">  SHA-256(client data)</text>
  <rect x="34" y="290" width="248" height="38" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="158" y="305" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--accent)" text-anchor="middle">Sam's passkey private key</text>
  <text x="158" y="321" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">never leaves the device</text>

  <line x1="105" y1="370" x2="314" y2="370" stroke="var(--accent)" stroke-width="2" marker-end="url(#ts-arrow-accent)"/>
  <text x="212" y="363" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--accent)" text-anchor="middle">the assertion</text>
  <rect x="20" y="376" width="296" height="34" fill="var(--paper)" stroke="none"/>
  <text x="34" y="388" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">signature, credential id, authenticatorData</text>
  <text x="34" y="404" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">(RP ID hash, flags, counter), client data</text>

  <!-- IdentiKey verifies -->
  <rect x="236" y="426" width="384" height="140" rx="6" fill="var(--paper)" stroke="var(--accent)" stroke-width="2"/>
  <text x="250" y="448" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--accent)">IdentiKey verifies</text>
  <rect x="250" y="458" width="356" height="32" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="428" y="472" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--accent)" text-anchor="middle">with Sam's stored public key</text>
  <text x="428" y="486" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">found by credential id; saved once, at registration</text>
  <text x="250" y="510" font-family="var(--font-display)" font-size="12" fill="var(--ink)">the challenge is the one it issued; the origin is its own</text>
  <text x="250" y="528" font-family="var(--font-display)" font-size="12" fill="var(--ink)">the RP ID hash matches; user verification happened</text>
  <text x="250" y="546" font-family="var(--font-display)" font-size="12" fill="var(--ink)">counter: if not 0, it must exceed the last value seen</text>

  <!-- Signature 2 -->
  <line x1="20" y1="590" x2="620" y2="590" stroke="var(--warm)" stroke-width="1.5"/>
  <rect x="20" y="582" width="350" height="18" rx="3" fill="var(--paper)" stroke="none"/>
  <text x="24" y="596" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--warm)">Signature 2: IdentiKey vouches for Sam to the app</text>

  <rect x="210" y="612" width="220" height="60" rx="6" fill="var(--paper)" stroke="var(--warm)" stroke-width="2"/>
  <text x="320" y="632" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">signs the ID token, EdDSA</text>
  <text x="320" y="648" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--warm)" text-anchor="middle">IdentiKey's Ed25519 private key</text>
  <text x="320" y="664" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">never leaves the provider</text>

  <line x1="320" y1="700" x2="529" y2="700" stroke="var(--warm)" stroke-width="2" marker-end="url(#ts-arrow-warm)"/>
  <text x="427" y="693" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--warm)" text-anchor="middle">ID token</text>
  <text x="427" y="716" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">via the code and /token (section 10)</text>

  <line x1="535" y1="752" x2="326" y2="752" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#ts-arrow-ink)"/>
  <text x="427" y="745" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">GET /.well-known/jwks.json</text>
  <line x1="320" y1="784" x2="529" y2="784" stroke="var(--warm)" stroke-width="1.5" marker-end="url(#ts-arrow-warm)"/>
  <text x="427" y="777" font-family="var(--font-display)" font-size="12" fill="var(--warm)" text-anchor="middle">IdentiKey's public key (by kid)</text>

  <!-- app verifies -->
  <rect x="380" y="800" width="240" height="56" rx="6" fill="var(--paper)" stroke="var(--warm)" stroke-width="2"/>
  <text x="500" y="820" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">the app verifies, locally,</text>
  <text x="500" y="836" font-family="var(--font-display)" font-size="12" fill="var(--ink)" text-anchor="middle">with the JWKS key; then checks</text>
  <text x="500" y="852" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">iss  aud  exp  nonce</text>

  <!-- summary -->
  <rect x="20" y="800" width="340" height="56" rx="4" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="1.5"/>
  <text x="34" y="820" font-family="var(--font-display)" font-size="12" fill="var(--ink)"><tspan fill="var(--accent)" font-weight="600">Sam's pair:</tspan> private on the device, public at IdentiKey</text>
  <text x="34" y="836" font-family="var(--font-display)" font-size="12" fill="var(--ink)"><tspan fill="var(--warm)" font-weight="600">IdentiKey's pair:</tspan> private in the provider, public in JWKS</text>
  <text x="34" y="852" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">no private key crosses; the app never sees Sam's</text>

  <text x="320" y="890" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Each verifier checks only the signature made for it, with the public half it already holds.</text>
</svg>
