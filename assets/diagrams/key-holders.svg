<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="kh-title">
  <title id="kh-title">The keys by holder, in three zones. You hold your passkey (ES256 on P-256, or RS256, inside your authenticator) and any SSH or git device key; your client program holds the ephemeral Ed25519 session key. The IdentiKey server keeps in its database the managed key blob (the operational Ed25519 seed, holding Sign and Auth), the encapsulation key blob (your X25519 scalar) and an unsigned copy of your XID document; it takes the managed wrap key, which seals both blobs, from its environment; and it takes the OIDC signing key and the pairwise salt from its environment or from files in its data directory, publishing the signing key's public half as the only key in its JWKS. Nobody holds the inception key, which carries Elect, Transfer, Update and Verify: its private half is discarded at signup. Arrows show that every use of the operational key needs a fresh passkey assertion, and that the operational key signs the bind for the session key.</title>
  <defs>
    <marker id="kh-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2)"/>
    </marker>
    <marker id="kh-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- zone: you -->
  <rect x="16" y="14" width="608" height="166" rx="8" fill="var(--accent-soft)" stroke="none"/>
  <text x="32" y="38" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--accent)">You</text>
  <text x="608" y="38" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="end">private halves that never reach the service</text>

  <rect x="30" y="52" width="190" height="112" rx="4" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="125" y="76" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">passkey</text>
  <text x="125" y="96" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">ES256 (P-256) or RS256</text>
  <text x="125" y="116" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">inside your authenticator</text>
  <text x="125" y="134" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">public key on the account</text>
  <text x="125" y="152" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">A3 proof of presence</text>

  <rect x="230" y="52" width="180" height="112" rx="4" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="320" y="76" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">SSH or git device key</text>
  <text x="320" y="96" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">on your machine</text>
  <text x="320" y="116" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">public half listed as an</text>
  <text x="320" y="134" font-family="var(--font-mono)" font-size="12" fill="var(--ink-2)" text-anchor="middle">ssh_git credential</text>

  <rect x="420" y="52" width="190" height="112" rx="4" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="515" y="72" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">client program</text>
  <text x="515" y="96" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">session key</text>
  <text x="515" y="116" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">Ed25519, ephemeral</text>
  <text x="515" y="136" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">bound to you for one</text>
  <text x="515" y="152" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">operation and resource</text>

  <!-- zone: IdentiKey server -->
  <rect x="16" y="262" width="608" height="352" rx="8" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="608" y="282" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="end">IdentiKey server</text>

  <!-- database -->
  <rect x="30" y="290" width="580" height="148" rx="6" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5"/>
  <text x="596" y="310" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink-2)" text-anchor="end">database</text>

  <rect x="44" y="304" width="190" height="120" rx="4" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="139" y="326" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">managed key blob</text>
  <text x="139" y="346" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">the operational key:</text>
  <text x="139" y="364" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">Ed25519 seed</text>
  <text x="139" y="384" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">Sign  Auth</text>
  <text x="139" y="410" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">answers challenges</text>

  <rect x="244" y="318" width="170" height="106" rx="4" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="329" y="340" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">encapsulation key blob</text>
  <text x="329" y="360" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">X25519 scalar</text>
  <text x="329" y="380" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">data encrypted to you</text>
  <text x="329" y="398" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">exportable to you</text>
  <text x="329" y="414" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">on consent</text>

  <rect x="424" y="318" width="172" height="106" rx="4" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5"/>
  <text x="510" y="340" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">XID document</text>
  <text x="510" y="360" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">public halves and</text>
  <text x="510" y="378" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">privileges only;</text>
  <text x="510" y="396" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">stored unsigned</text>

  <!-- cross-zone arrows -->
  <line x1="90" y1="166" x2="90" y2="302" stroke="var(--accent)" stroke-width="2" marker-end="url(#kh-arrow-accent)"/>
  <rect x="98" y="196" width="150" height="34" fill="var(--paper)" stroke="none"/>
  <text x="104" y="209" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--accent)">a fresh assertion</text>
  <text x="104" y="225" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--accent)">for every use</text>

  <path d="M190 304 V250 H560 V170" fill="none" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#kh-arrow-ink)"/>
  <rect x="300" y="224" width="170" height="16" fill="var(--paper)" stroke="none"/>
  <text x="385" y="236" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">signs the session bind</text>

  <!-- seals -->
  <line x1="139" y1="478" x2="139" y2="430" stroke="var(--accent)" stroke-width="2" marker-end="url(#kh-arrow-accent)"/>
  <path d="M220 478 V456 H329 V430" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#kh-arrow-accent)"/>
  <rect x="236" y="440" width="76" height="14" fill="var(--paper-2)" stroke="none"/>
  <text x="274" y="451" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--accent)" text-anchor="middle">seals both</text>

  <!-- environment -->
  <rect x="30" y="478" width="250" height="122" rx="6" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5"/>
  <text x="44" y="498" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink-2)">environment</text>
  <text x="44" y="522" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)">managed wrap key</text>
  <text x="44" y="542" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">32 bytes, XChaCha20-Poly1305</text>
  <text x="44" y="560" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">one key, key id <tspan font-family="var(--font-mono)">v1</tspan></text>
  <text x="44" y="586" font-family="var(--font-mono)" font-size="12" fill="var(--ink-3)">IDENTIKEY_MANAGED_WRAP_KEY</text>

  <rect x="290" y="478" width="320" height="122" rx="6" fill="var(--paper)" stroke="var(--rule)" stroke-width="1.5"/>
  <text x="304" y="498" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink-2)">environment, or a file in the data directory</text>
  <text x="304" y="522" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)">OIDC signing key <tspan font-family="var(--font-mono)" font-size="12" font-weight="400">Ed25519</tspan></text>
  <text x="304" y="540" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">signs ID tokens; its public half is</text>
  <text x="304" y="556" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">the only key in the JWKS</text>
  <text x="304" y="578" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)">pairwise salt <tspan font-family="var(--font-mono)" font-size="12" font-weight="400">32 bytes</tspan></text>
  <text x="304" y="594" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">derives every pairwise subject</text>

  <!-- zone: nobody -->
  <rect x="16" y="636" width="608" height="110" rx="8" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="32" y="660" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--ink)">Nobody</text>
  <text x="320" y="660" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">inception key (the user signing key)</text>
  <text x="320" y="680" font-family="var(--font-mono)" font-size="12" fill="var(--ink-2)" text-anchor="middle">Schnorr, secp256k1</text>
  <text x="320" y="700" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink-3)" text-anchor="middle">Elect  Transfer  Update  Verify</text>
  <text x="320" y="726" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--bad)" text-anchor="middle">private half discarded at signup; only its public half, hashed into the XID, remains</text>
</svg>
