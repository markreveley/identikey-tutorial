<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 846" role="img" aria-labelledby="dp-title">
  <title id="dp-title">The device grant across three parties. The tool, a command-line program with no browser, posts its client id to /device_authorization and receives a secret device_code, which stays on the tool, and a short user_code, the /device address, a fifteen-minute expiry and a five-second polling interval. The tool shows the user code; the person reads it and types it on a phone or laptop that holds their passkey, which is the only link between the two devices. Meanwhile the tool polls /token with the device code and is told authorization_pending, or slow_down if it polls too fast. On the second device the person opens /device, enters the code, sees the client's registered name, and approves with a passkey assertion, or denies. The tool's next poll returns the tokens, or access_denied, or expired_token after fifteen minutes. The provider cannot tell whether the person who typed the code is the one who started the flow.</title>
  <defs>
    <marker id="dp-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2)"/>
    </marker>
    <marker id="dp-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="dp-arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--warm)"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <line x1="100" y1="64" x2="100" y2="730" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="320" y1="64" x2="320" y2="730" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="540" y1="64" x2="540" y2="730" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- participants -->
  <rect x="20" y="18" width="160" height="44" rx="4" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="100" y="37" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">Tool</text>
  <text x="100" y="53" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">CLI over SSH, no browser</text>

  <rect x="240" y="18" width="160" height="44" rx="4" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="320" y="37" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">IdentiKey</text>
  <text x="320" y="53" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">the provider</text>

  <rect x="460" y="18" width="160" height="44" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="540" y="37" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--accent)" text-anchor="middle">Phone or laptop</text>
  <text x="540" y="53" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">has your passkey</text>

  <!-- 1. Start -->
  <line x1="20" y1="82" x2="620" y2="82" stroke="var(--rule)" stroke-width="1.5"/>
  <rect x="20" y="74" width="70" height="18" rx="3" fill="var(--paper)" stroke="none"/>
  <text x="24" y="88" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)">1  Start</text>

  <line x1="100" y1="118" x2="314" y2="118" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#dp-arrow-ink)"/>
  <text x="210" y="111" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">POST /device_authorization</text>
  <text x="210" y="134" font-family="var(--font-mono)" font-size="12" fill="var(--ink-2)" text-anchor="middle">client_id</text>
  <rect x="336" y="104" width="284" height="34" fill="var(--paper)" stroke="none"/>
  <text x="340" y="116" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">checks the registration lists the device grant;</text>
  <text x="340" y="132" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">if not, <tspan font-family="var(--font-mono)">unauthorized_client</tspan> and no codes</text>

  <line x1="320" y1="160" x2="106" y2="160" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#dp-arrow-ink)"/>
  <text x="210" y="153" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">two codes, once</text>
  <text x="112" y="180" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--warm)">device_code</text>
  <text x="206" y="180" font-family="var(--font-display)" font-size="12" fill="var(--warm)">secret, kept here</text>
  <text x="112" y="198" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--accent)">user_code</text>
  <text x="206" y="198" font-family="var(--font-mono)" font-size="12" fill="var(--accent)">WDJB-MJHT</text>
  <text x="112" y="216" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)"><tspan font-family="var(--font-mono)">/device</tspan>, expires in 15 min,</text>
  <text x="112" y="232" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">poll every 5 s</text>

  <!-- 2. Show and poll -->
  <line x1="20" y1="252" x2="620" y2="252" stroke="var(--rule)" stroke-width="1.5"/>
  <rect x="20" y="244" width="124" height="18" rx="3" fill="var(--paper)" stroke="none"/>
  <text x="24" y="258" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)">2  Show and poll</text>

  <rect x="24" y="272" width="152" height="46" rx="4" fill="var(--paper-2)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="100" y="291" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">the tool's screen shows</text>
  <text x="100" y="309" font-family="var(--font-mono)" font-size="13" font-weight="600" fill="var(--accent)" text-anchor="middle">WDJB-MJHT</text>

  <path d="M176 296 C 300 296, 380 340, 534 340" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#dp-arrow-accent)"/>
  <rect x="392" y="272" width="228" height="50" fill="var(--paper)" stroke="none"/>
  <text x="396" y="284" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--accent)">you read the code and type it</text>
  <text x="396" y="300" font-family="var(--font-display)" font-size="12" fill="var(--accent)">on the other device: a person, not</text>
  <text x="396" y="316" font-family="var(--font-display)" font-size="12" fill="var(--accent)">a network, is the only link</text>

  <rect x="30" y="352" width="270" height="78" rx="6" fill="none" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="100" y1="372" x2="314" y2="372" stroke="var(--warm)" stroke-width="2" marker-end="url(#dp-arrow-warm)"/>
  <text x="210" y="366" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--warm)" text-anchor="middle">POST /token  device_code</text>
  <line x1="320" y1="402" x2="106" y2="402" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#dp-arrow-ink)"/>
  <text x="210" y="396" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">authorization_pending</text>
  <text x="40" y="422" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">repeat every 5 s; faster gets <tspan font-family="var(--font-mono)">slow_down</tspan></text>
  <rect x="336" y="384" width="190" height="34" fill="var(--paper)" stroke="none"/>
  <text x="340" y="396" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">each <tspan font-family="var(--font-mono)">slow_down</tspan> adds 5 s</text>
  <text x="340" y="412" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">to the interval it enforces</text>

  <!-- 3. Approve -->
  <line x1="20" y1="452" x2="620" y2="452" stroke="var(--rule)" stroke-width="1.5"/>
  <rect x="20" y="444" width="220" height="18" rx="3" fill="var(--paper)" stroke="none"/>
  <text x="24" y="458" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)">3  Approve, on the other device</text>

  <line x1="540" y1="492" x2="326" y2="492" stroke="var(--accent)" stroke-width="2" marker-end="url(#dp-arrow-accent)"/>
  <text x="430" y="485" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--accent)" text-anchor="middle">/device  WDJB-MJHT</text>
  <text x="430" y="508" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">open the page, enter the user code</text>

  <line x1="320" y1="540" x2="534" y2="540" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#dp-arrow-ink)"/>
  <text x="430" y="533" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">“Mjolnir CLI” is asking</text>
  <text x="430" y="556" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">its registered name; Approve or Deny</text>

  <line x1="540" y1="590" x2="326" y2="590" stroke="var(--accent)" stroke-width="2" marker-end="url(#dp-arrow-accent)"/>
  <text x="430" y="583" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--accent)" text-anchor="middle">Approve: a passkey assertion</text>
  <text x="430" y="606" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">checked as in section 10; the request</text>
  <text x="430" y="622" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">is approved for this account</text>

  <rect x="30" y="510" width="200" height="34" fill="var(--paper)" stroke="none"/>
  <text x="40" y="522" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">the tool keeps polling and</text>
  <text x="40" y="538" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">never sees this exchange</text>

  <!-- 4. Tokens -->
  <line x1="20" y1="642" x2="620" y2="642" stroke="var(--rule)" stroke-width="1.5"/>
  <rect x="20" y="634" width="76" height="18" rx="3" fill="var(--paper)" stroke="none"/>
  <text x="24" y="648" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)">4  Tokens</text>

  <line x1="100" y1="676" x2="314" y2="676" stroke="var(--warm)" stroke-width="2" marker-end="url(#dp-arrow-warm)"/>
  <text x="210" y="670" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--warm)" text-anchor="middle">POST /token  device_code</text>
  <line x1="320" y1="710" x2="106" y2="710" stroke="var(--accent)" stroke-width="2" marker-end="url(#dp-arrow-accent)"/>
  <text x="210" y="704" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--accent)" text-anchor="middle">access, ID and refresh tokens</text>
  <rect x="336" y="664" width="284" height="50" fill="var(--paper)" stroke="none"/>
  <text x="340" y="676" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">or <tspan font-family="var(--font-mono)">access_denied</tspan> if the user denied,</text>
  <text x="340" y="692" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">or <tspan font-family="var(--font-mono)">expired_token</tspan> after 15 minutes;</text>
  <text x="340" y="708" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">the device code works once</text>

  <!-- legend -->
  <line x1="30" y1="752" x2="70" y2="752" stroke="var(--warm)" stroke-width="2"/>
  <text x="78" y="756" font-family="var(--font-display)" font-size="12" fill="var(--ink)"><tspan font-family="var(--font-mono)">device_code</tspan>: only ever between the tool and <tspan font-family="var(--font-mono)">/token</tspan></text>
  <line x1="30" y1="774" x2="70" y2="774" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="78" y="778" font-family="var(--font-display)" font-size="12" fill="var(--ink)"><tspan font-family="var(--font-mono)">user_code</tspan>: carried by a person to the device with the passkey</text>

  <!-- weakness -->
  <rect x="20" y="794" width="600" height="40" rx="4" fill="var(--bad-soft)" stroke="var(--bad)" stroke-width="1.5"/>
  <text x="320" y="810" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--bad)" text-anchor="middle">The provider cannot tell whether the person typing the code started the flow.</text>
  <text x="320" y="826" font-family="var(--font-display)" font-size="12" fill="var(--ink)" text-anchor="middle">An attacker can start one and send you the code with a plausible story; so the grant is opt-in per client.</text>
</svg>
