<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 786" role="img" aria-labelledby="sg-title">
  <title id="sg-title">What signup creates: one /signup request generates a user key (Schnorr secp256k1 plus X25519) and an operational key (Ed25519), builds the XID document in which the user key holds Elect, Transfer, Verify and Update and the operational key holds Sign and Auth, discards the user's signing private key, seals the X25519 scalar as the encapsulation key and the Ed25519 seed as the managed key blob under the managed wrap key, stores the account at rung C2, hands the browser an account cookie and starts passkey registration.</title>
  <defs>
    <marker id="sg-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2)"/>
    </marker>
    <marker id="sg-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
    <marker id="sg-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--bad)"/>
    </marker>
  </defs>

  <!-- 1. the request -->
  <rect x="180" y="22" width="280" height="52" rx="6" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="320" y="44" font-family="var(--font-mono)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">POST /signup</text>
  <text x="320" y="62" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">one request, before you touch a passkey</text>

  <!-- split to two key pairs -->
  <path d="M320 74 V90 H170 V109" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#sg-arrow-accent)"/>
  <path d="M320 90 H470 V109" fill="none" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#sg-arrow-ink)"/>
  <text x="320" y="106" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">generates two key pairs</text>

  <!-- user key -->
  <rect x="30" y="114" width="280" height="98" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="170" y="138" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--accent)" text-anchor="middle">user key</text>
  <text x="170" y="158" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">Schnorr secp256k1 + X25519</text>
  <text x="170" y="178" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">signing and encryption; the inception key</text>
  <text x="170" y="196" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">XID = hash of its public half</text>

  <!-- operational key -->
  <rect x="330" y="114" width="280" height="98" rx="4" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="470" y="138" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">operational key</text>
  <text x="470" y="158" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">Ed25519</text>
  <text x="470" y="178" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">a signing key that belongs to IdentiKey</text>
  <text x="470" y="196" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">does the daily work</text>

  <!-- 2. the XID document -->
  <line x1="170" y1="214" x2="170" y2="238" stroke="var(--accent)" stroke-width="2" marker-end="url(#sg-arrow-accent)"/>
  <line x1="470" y1="214" x2="470" y2="238" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#sg-arrow-ink)"/>

  <rect x="30" y="242" width="580" height="118" rx="6" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="46" y="264" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--ink)">XID document</text>
  <text x="594" y="264" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="end">built from both public halves; refused if IdentiKey's key would get All or Elect</text>

  <rect x="46" y="276" width="270" height="70" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="181" y="297" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--accent)" text-anchor="middle">user key</text>
  <text x="181" y="317" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">Elect Transfer Verify Update</text>
  <text x="181" y="336" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">governing</text>

  <rect x="324" y="276" width="270" height="70" rx="4" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="459" y="297" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">operational key</text>
  <text x="459" y="317" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">Sign Auth</text>
  <text x="459" y="336" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">doing</text>

  <!-- 3 and 4. the private halves -->
  <text x="320" y="382" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">then the three private secrets:</text>
  <line x1="120" y1="362" x2="120" y2="400" stroke="var(--bad)" stroke-width="1.5" marker-end="url(#sg-arrow-bad)"/>
  <line x1="520" y1="362" x2="520" y2="400" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#sg-arrow-ink)"/>

  <!-- wrap-key band around the two sealed blobs -->
  <rect x="222" y="396" width="398" height="178" rx="6" fill="var(--paper-2)" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="421" y="512" font-family="var(--font-display)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">both sealed under the managed wrap key</text>
  <text x="421" y="529" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">XChaCha20-Poly1305, a 32-byte secret from the environment,</text>
  <text x="421" y="545" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">identified by a key id so it can be rotated forward;</text>
  <text x="421" y="561" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">the envelope binds the account XID and the key's public half</text>

  <!-- discarded signing key -->
  <rect x="30" y="404" width="180" height="84" rx="4" fill="var(--paper)" stroke="var(--bad)" stroke-width="1.5"/>
  <text x="114" y="428" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">Schnorr signing key</text>
  <line x1="46" y1="424" x2="182" y2="424" stroke="var(--bad)" stroke-width="2"/>
  <text x="120" y="450" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--bad)" text-anchor="middle">discarded, never stored</text>
  <text x="120" y="468" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">nothing here can sign</text>
  <text x="120" y="482" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">with the Elect key</text>
  <line x1="192" y1="411" x2="204" y2="423" stroke="var(--bad)" stroke-width="2"/>
  <line x1="204" y1="411" x2="192" y2="423" stroke="var(--bad)" stroke-width="2"/>

  <!-- encapsulation key -->
  <rect x="236" y="404" width="170" height="84" rx="4" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="321" y="428" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">X25519 private scalar</text>
  <text x="321" y="448" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">from the user key</text>
  <text x="321" y="468" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">sealed as the</text>
  <text x="321" y="482" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--accent)" text-anchor="middle">encapsulation key</text>

  <!-- managed key blob -->
  <rect x="436" y="404" width="170" height="84" rx="4" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="521" y="428" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">Ed25519 seed, 32 bytes</text>
  <text x="521" y="448" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">from the operational key</text>
  <text x="521" y="468" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">sealed as the</text>
  <text x="521" y="482" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="middle">managed key blob</text>

  <!-- 5. the account -->
  <path d="M421 574 V584 H320 V604" fill="none" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#sg-arrow-ink)"/>

  <rect x="120" y="608" width="400" height="56" rx="6" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="320" y="630" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">account stored at custody rung C2</text>
  <text x="320" y="650" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">the document, the encapsulation key and the managed key blob</text>

  <!-- 6. sign in and start passkey registration -->
  <path d="M320 664 V680 H170 V698" fill="none" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#sg-arrow-ink)"/>
  <path d="M320 680 H470 V698" fill="none" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#sg-arrow-ink)"/>

  <rect x="30" y="702" width="280" height="70" rx="4" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="170" y="724" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">browser receives the account cookie</text>
  <text x="170" y="743" font-family="var(--font-mono)" font-size="12" fill="var(--ink)" text-anchor="middle">identikey_account</text>
  <text x="170" y="760" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">HttpOnly, Secure, SameSite=Lax, 24 hours</text>

  <rect x="330" y="702" width="280" height="70" rx="4" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="470" y="724" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">passkey registration begins</text>
  <text x="470" y="743" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">WebAuthn options, user name = the XID</text>
  <text x="470" y="760" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">until saved: unreachable from another browser</text>
</svg>
