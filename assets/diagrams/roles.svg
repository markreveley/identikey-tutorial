<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="roles-title">
  <title id="roles-title">Delegated sign-in: the app sends the browser to the provider, the provider authenticates with a passkey and returns a signed ID token through the browser; no credential ever reaches the app.</title>
  <defs>
    <marker id="roles-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/>
    </marker>
<marker id="roles-arrow-ink-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2)"/>
    </marker>
  </defs>

  <!-- App (relying party) -->
  <rect x="170" y="30" width="300" height="60" rx="4" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="320" y="55" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">App</text>
  <text x="320" y="75" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">relying party</text>

  <!-- Browser (the person) -->
  <rect x="170" y="240" width="300" height="60" rx="4" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="320" y="265" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">Browser</text>
  <text x="320" y="285" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">the person, holding a passkey</text>

  <!-- Provider (IdentiKey) -->
  <rect x="170" y="450" width="300" height="60" rx="4" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="320" y="475" font-family="var(--font-display)" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="middle">Provider</text>
  <text x="320" y="495" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">IdentiKey, the OpenID Provider</text>

  <!-- 1: app sends the browser to the provider -->
  <line x1="220" y1="92" x2="220" y2="236" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#roles-arrow-ink-2)"/>
  <text x="160" y="158" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="end">1  redirect</text>
  <text x="160" y="176" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="end">the app sends the</text>
  <text x="160" y="192" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="end">browser to the provider</text>

  <!-- 2: passkey authentication between browser and provider -->
  <line x1="220" y1="304" x2="220" y2="446" stroke="var(--ink-2)" stroke-width="1.5" marker-start="url(#roles-arrow-ink-2)" marker-end="url(#roles-arrow-ink-2)"/>
  <text x="160" y="368" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="end">2  authenticate</text>
  <text x="160" y="386" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="end">the provider checks</text>
  <text x="160" y="402" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="end">the person's passkey</text>

  <!-- 3: ID token, the signed statement, back through the browser -->
  <line x1="420" y1="448" x2="420" y2="304" stroke="var(--accent)" stroke-width="2" marker-end="url(#roles-arrow-accent)"/>
  <line x1="420" y1="238" x2="420" y2="94" stroke="var(--accent)" stroke-width="2" marker-end="url(#roles-arrow-accent)"/>
  <text x="480" y="368" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--accent)">3  ID token</text>
  <text x="480" y="386" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">a signed statement</text>
  <text x="480" y="402" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">of who signed in</text>
  <text x="480" y="168" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">the browser carries</text>
  <text x="480" y="184" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)">the ID token to the app</text>

  <!-- the credential never reaches the app -->
  <line x1="320" y1="238" x2="320" y2="120" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="311" y1="103" x2="329" y2="121" stroke="var(--bad)" stroke-width="2"/>
  <line x1="329" y1="103" x2="311" y2="121" stroke="var(--bad)" stroke-width="2"/>
  <rect x="254" y="150" width="132" height="44" rx="3" fill="var(--paper)" stroke="none"/>
  <text x="320" y="167" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--bad)" text-anchor="middle">credential</text>
  <text x="320" y="185" font-family="var(--font-display)" font-size="12" fill="var(--bad)" text-anchor="middle">never reaches the app</text>

  <text x="320" y="546" font-family="var(--font-display)" font-size="12" fill="var(--ink-2)" text-anchor="middle">The app never sees a credential, only the signed statement.</text>
</svg>
